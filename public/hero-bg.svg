<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#571b1b"/>
      <stop offset="0.55" stop-color="#7a2626"/>
      <stop offset="1" stop-color="#93392f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.78" r="0.75">
      <stop offset="0" stop-color="#e8a25c" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#c9772a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c9772a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3129"/>
      <stop offset="1" stop-color="#712523"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b211f"/>
      <stop offset="1" stop-color="#571b1b"/>
    </linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c1616"/>
      <stop offset="1" stop-color="#3c1111"/>
    </linearGradient>
    <linearGradient id="r4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#331010"/>
      <stop offset="1" stop-color="#260b0b"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.95  0 0 0 0 0.85  0 0 0 0 0.72  0 0 0 0.06 0"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- low sun -->
  <circle cx="1195" cy="705" r="120" fill="#f2d9c4" opacity="0.34"/>
  <circle cx="1195" cy="705" r="120" fill="#f2d9c4" opacity="0.25" filter="url(#soft)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- distant ridge -->
  <path fill="url(#r1)" opacity="0.85" d="M0,742 C130,700 240,668 380,684 C520,700 590,650 730,628 C860,608 940,648 1070,660 C1210,672 1300,606 1440,596 C1580,586 1700,646 1810,652 L1920,660 L1920,1080 L0,1080 Z"/>
  <!-- mist band -->
  <ellipse cx="900" cy="792" rx="980" ry="60" fill="#e8a25c" opacity="0.10" filter="url(#soft)"/>
  <!-- mid ridge -->
  <path fill="url(#r2)" d="M0,830 C150,800 260,756 410,772 C560,788 660,738 800,730 C950,722 1030,772 1170,780 C1330,790 1430,722 1570,716 C1690,712 1810,758 1920,752 L1920,1080 L0,1080 Z"/>
  <!-- near ridge -->
  <path fill="url(#r3)" d="M0,920 C170,900 300,858 470,876 C640,894 760,846 910,842 C1070,838 1170,886 1330,890 C1480,894 1600,846 1730,844 L1920,852 L1920,1080 L0,1080 Z"/>
  <!-- foreground -->
  <path fill="url(#r4)" d="M0,1004 C220,986 380,952 580,966 C780,980 920,942 1120,946 C1320,950 1480,986 1660,978 L1920,962 L1920,1080 L0,1080 Z"/>

  <!-- film grain -->
  <rect width="1920" height="1080" filter="url(#grain)"/>
</svg>
